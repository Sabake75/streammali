<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body {
    margin:0; padding:0; width:1024px; height:500px; overflow:hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .banner {
    width:1024px; height:500px; position:relative;
    background: linear-gradient(135deg, #0A1B33 0%, #0F2D52 45%, #2F6FE0 100%);
    display:flex; align-items:center; justify-content:flex-start;
    box-sizing:border-box; padding: 0 72px;
  }
  .glow {
    position:absolute; border-radius:50%;
    background: radial-gradient(circle, rgba(140,180,235,0.35) 0%, rgba(140,180,235,0) 70%);
  }
  .glow.g1 { width:520px; height:520px; top:-180px; right:-120px; }
  .glow.g2 { width:380px; height:380px; bottom:-160px; right:180px; }
  .icon {
    width:190px; height:190px; border-radius:44px; flex-shrink:0;
    box-shadow: 0 18px 45px rgba(0,0,0,0.35);
  }
  .text { margin-left:56px; color:#fff; z-index:2; }
  .title {
    font-size:64px; font-weight:800; letter-spacing:-1px; margin:0 0 14px 0;
    text-shadow: 0 4px 18px rgba(0,0,0,0.25);
  }
  .tagline {
    font-size:26px; font-weight:500; color:#DCE7FA; margin:0; max-width:560px; line-height:1.35;
  }
  .badges { margin-top:26px; display:flex; gap:14px; }
  .badge {
    background: rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28);
    color:#fff; font-size:16px; font-weight:600; padding:9px 18px; border-radius:999px;
  }
</style>
</head>
<body>
  <!--
    Regenerer le PNG :
    google-chrome --headless --disable-gpu --no-sandbox --window-size=1024,500 \
      --screenshot=feature-graphic.png "file://$(pwd)/feature-graphic.html"
  -->
  <div class="banner">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <img class="icon" src="../../apps/mobile/web/icons/Icon-512.png" />
    <div class="text">
      <p class="title">StreamMali</p>
      <p class="tagline">Films, clips et séries maliennes à 100 FCFA,<br>payables en Mobile Money.</p>
      <div class="badges">
        <div class="badge">Orange Money</div>
        <div class="badge">Moov Money</div>
        <div class="badge">100% malien</div>
      </div>
    </div>
  </div>
</body>
</html>
