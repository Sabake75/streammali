services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streammali
      POSTGRES_USER: streammali
      POSTGRES_PASSWORD: streammali
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streammali"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
    volumes:
      - ../apps/api:/var/www/html
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      API_INTERNAL_URL: http://api:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  web_node_modules:
