databases:
  - name: streammali-postgres
    plan: starter
    databaseName: streammali
    user: streammali

services:
  - type: web
    name: streammali-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile.prod
    dockerContext: ./apps/api
    plan: starter
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_NAME
        value: StreamMali
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      # Unknown until the first deploy assigns a *.onrender.com hostname —
      # set manually in the dashboard afterwards, then redeploy.
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: streammali-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: streammali-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: streammali-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: streammali-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: streammali-postgres
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: MAIL_MAILER
        value: log
      # Identity documents must not live on the container's ephemeral disk
      # (wiped on every deploy) — see apps/api/app/Domain/Creator/Actions/RegisterCreator.php.
      # Point this at an S3-compatible bucket (Cloudflare R2 recommended,
      # same provider as video hosting) and fill in the AWS_* vars below.
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      # Set once the Vercel deployment URL is known.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PLATFORM_COMMISSION_RATE
        value: "0.25"
      - key: PLATFORM_MINIMUM_PAYOUT_AMOUNT
        value: "10000"
      - key: ORANGE_MONEY_BASE_URL
        value: https://api.orange.com
      - key: ORANGE_MONEY_COUNTRY
        value: ml
      - key: ORANGE_MONEY_CLIENT_ID
        sync: false
      - key: ORANGE_MONEY_CLIENT_SECRET
        sync: false
      - key: ORANGE_MONEY_MERCHANT_KEY
        sync: false
      - key: ORANGE_MONEY_RETURN_URL
        sync: false
      - key: ORANGE_MONEY_CANCEL_URL
        sync: false
      - key: ORANGE_MONEY_NOTIF_URL
        sync: false
      - key: CLOUDFLARE_STREAM_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_STREAM_API_TOKEN
        sync: false
      - key: CLOUDFLARE_STREAM_MAX_DURATION_SECONDS
        value: "7200"
