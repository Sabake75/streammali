databases:
  - name: streammali-postgres
    plan: basic-256mb
    databaseName: streammali
    user: streammali

services:
  - type: web
    name: streammali-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile.prod
    dockerContext: ./apps/api
    plan: starter
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_NAME
        value: StreamMali
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # generateValue: true produced a string Laravel's Encrypter rejected
      # ("Unsupported cipher or incorrect key length") — Render's generic
      # secret generator isn't aware of Laravel's expected format
      # (base64: prefix + a 32-byte key for AES-256-CBC). Only broke
      # anything that actually touches the encrypter (session/cookie
      # encryption — Filament's /moderation login) since Sanctum's
      # stateless API auth never needed it; that's why the rest of the
      # API worked fine. Set manually: run `php artisan key:generate
      # --show` (in this service's own Shell, so the key is never typed
      # anywhere else) and paste the base64:... value here.
      - key: APP_KEY
        sync: false
      # Unknown until the first deploy assigns a *.onrender.com hostname —
      # set manually in the dashboard afterwards, then redeploy. MUST
      # include the https:// scheme (not just the bare hostname) — a
      # scheme-less/http:// value here made Filament generate its CSS/JS
      # asset links as http://, which the browser blocks as mixed
      # content on the https:// page (confirmed in production: page
      # rendered as unstyled HTML, no console errors visible without
      # opening devtools). trustProxies(at: '*') in bootstrap/app.php
      # covers scheme detection elsewhere, but asset()/url() still
      # follow APP_URL literally when it's set.
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: BCRYPT_ROUNDS
        value: "12"
      # "stack" defaults to the "single" channel (storage/logs/laravel.log,
      # a file inside the ephemeral container) — invisible in Render's own
      # Logs tab, which only captures stdout/stderr. stderr puts Laravel's
      # own exceptions right alongside FrankenPHP's JSON logs Render
      # already shows.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: streammali-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: streammali-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: streammali-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: streammali-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: streammali-postgres
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: MAIL_MAILER
        value: log
      # Identity documents must not live on the container's ephemeral disk
      # (wiped on every deploy) — see apps/api/app/Domain/Creator/Actions/RegisterCreator.php.
      # Point this at an S3-compatible bucket (Cloudflare R2 recommended,
      # same provider as video hosting) and fill in the AWS_* vars below.
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      # Set once the streammali-web deployment URL is known (see that
      # service below — no Vercel here, same platform for both services).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PLATFORM_COMMISSION_RATE
        value: "0.25"
      - key: PLATFORM_MINIMUM_PAYOUT_AMOUNT
        value: "10000"
      # Orange Money est le gateway actif (voir AppServiceProvider) — PayDunya
      # reste configurable ci-dessous comme implémentation de rechange, en
      # attente que son KYC marchand aboutisse.
      - key: ORANGE_MONEY_BASE_URL
        value: https://api.orange.com
      # "dev" tant que seul le produit sandbox "Orange Money WebPay Dev" est
      # approuvé côté Developer Center — repasser à "ml" une fois le produit
      # de production approuvé (voir CLAUDE.md).
      - key: ORANGE_MONEY_COUNTRY
        value: dev
      - key: ORANGE_MONEY_CLIENT_ID
        sync: false
      - key: ORANGE_MONEY_CLIENT_SECRET
        sync: false
      # Sans le point final affiché sur le Developer Center (35ec1887, pas
      # 35ec1887.) — voir App\Domain\Payment\Gateways\OrangeMoneyGateway.
      - key: ORANGE_MONEY_MERCHANT_KEY
        sync: false
      # Renseigner une fois l'URL streammali-web connue (comme CORS_ALLOWED_ORIGINS).
      - key: ORANGE_MONEY_RETURN_URL
        sync: false
      - key: ORANGE_MONEY_CANCEL_URL
        sync: false
      # Renseigner une fois l'URL Render de ce service connue (comme APP_URL).
      - key: ORANGE_MONEY_NOTIF_URL
        sync: false
      - key: PAYDUNYA_BASE_URL
        value: https://app.paydunya.com/api/v1
      - key: PAYDUNYA_MASTER_KEY
        sync: false
      - key: PAYDUNYA_PRIVATE_KEY
        sync: false
      - key: PAYDUNYA_PUBLIC_KEY
        sync: false
      - key: PAYDUNYA_TOKEN
        sync: false
      # Renseigner une fois l'URL streammali-web connue (comme CORS_ALLOWED_ORIGINS).
      - key: PAYDUNYA_RETURN_URL
        sync: false
      - key: PAYDUNYA_CANCEL_URL
        sync: false
      # Renseigner une fois l'URL Render de ce service connue (comme APP_URL).
      - key: PAYDUNYA_CALLBACK_URL
        sync: false
      # Optionnel : laissé vide, le SDK Sentry reste inactif tant que non défini.
      - key: SENTRY_LARAVEL_DSN
        sync: false
      - key: CLOUDFLARE_STREAM_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_STREAM_API_TOKEN
        sync: false
      - key: CLOUDFLARE_STREAM_MAX_DURATION_SECONDS
        value: "7200"
      - key: CLOUDFLARE_STREAM_PREVIEW_DURATION_SECONDS
        value: "45"

  # Web (Next.js) — sur Render plutôt que Vercel : même compte déjà en
  # place, et `next start` gère nativement le $PORT que Render assigne
  # (contrairement à FrankenPHP côté API, aucun bricolage nécessaire ici).
  - type: web
    name: streammali-web
    runtime: node
    rootDir: apps/web
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://streammali-api.onrender.com/api
      # Unknown until the first deploy assigns a *.onrender.com hostname —
      # set manually in the dashboard afterwards, then redeploy (same as
      # APP_URL for the API service above).
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Optionnel : laissés vides, le SDK Sentry reste inactif tant que non définis.
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_DSN
        sync: false
